name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Ashita ${{ matrix.interface }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - interface: '4.16'
            ashita_ref: a362f9e3594c7ba8e9e3108b77b0033230ee1373
          - interface: '4.30'
            ashita_ref: 2e4b9c86de538ecfedabab918537c550d6378aaa

    steps:
      - name: Check out SpectralFix
        uses: actions/checkout@v4

      - name: Validate tag and project version
        shell: pwsh
        run: |
          $cmake = Get-Content -LiteralPath CMakeLists.txt -Raw
          if ($cmake -notmatch 'project\(SpectralFix VERSION ([0-9]+\.[0-9]+)') {
            throw 'Could not read project version.'
          }
          if ('v' + $Matches[1] -ne '${{ github.ref_name }}') {
            throw "Tag ${{ github.ref_name }} does not match project version $($Matches[1])."
          }

      - name: Check out the pinned Ashita SDK
        uses: actions/checkout@v4
        with:
          repository: AshitaXI/Ashita-v4beta
          ref: ${{ matrix.ashita_ref }}
          path: deps/ashita

      - name: Build, test, and package
        shell: pwsh
        run: >-
          ./scripts/Build-One.ps1
          -AshitaVersion '${{ matrix.interface }}'
          -AshitaSdkPath '${{ github.workspace }}\deps\ashita\plugins\sdk'

      - name: Upload release package
        uses: actions/upload-artifact@v4
        with:
          name: SpectralFix-Ashita-${{ matrix.interface }}
          path: out/packages/*.zip
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: windows-latest

    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate checksums
        shell: pwsh
        run: |
          $lines = Get-ChildItem -LiteralPath release-assets -Filter '*.zip' |
            Sort-Object Name |
            ForEach-Object {
              $hash = Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName
              "$($hash.Hash)  $($_.Name)"
            }
          $lines | Set-Content -LiteralPath release-assets/SHA256SUMS.txt -Encoding ascii

      - name: Create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $assets = Get-ChildItem -LiteralPath release-assets -File |
            ForEach-Object { $_.FullName }
          gh release create '${{ github.ref_name }}' $assets `
            --verify-tag `
            --generate-notes `
            --title "SpectralFix ${{ github.ref_name }}"
